<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTHU Chatroom Pro</title>
    <style>
      * { box-sizing: border-box; }
      :root { 
          --primary: #0084ff; 
          --bg: #dae0e6; 
          --white: #fff; 
          --text: #1c1e21; 
          --light: #65676b; 
          --danger: #dc3545; 
          --sidebar-bg: #f7f8f9;
      }
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; background: var(--bg); overflow: hidden; }

      #app { display: flex; height: 100vh; width: 100vw; justify-content: center; align-items: center; padding: 20px; }
      .hidden { display: none !important; }

      /* --- 彈窗 (Modal) 樣式 --- */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
      .modal-card { background: var(--white); padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
      .modal-card h3 { margin-top: 0; color: var(--primary); margin-bottom: 20px; }
      .modal-btns { display: flex; gap: 10px; margin-top: 15px; }

      /* --- 統一輸入框樣式 (重點修正) --- */
      .auth-card input,
      .modal-card input { 
          width: 100%; 
          padding: 12px 15px; 
          margin: 10px 0; 
          border: 1px solid #ddd; 
          border-radius: 8px; 
          box-sizing: border-box; 
          font-size: 14px;
          outline: none;
          transition: border-color 0.2s, box-shadow 0.2s;
      }
      .auth-card input:focus,
      .modal-card input:focus { 
          border-color: var(--primary); 
          box-shadow: 0 0 5px rgba(0, 132, 255, 0.2); 
      }

      /* --- 登入與個人設定 --- */
      .auth-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .auth-card { background: var(--white); padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
      .auth-card h2 { margin-top: 0; margin-bottom: 25px; color: var(--text); font-weight: bold; }

      .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 10px; }
      .btn-p { background: var(--primary); color: white; }
      .btn-sec { background: #e4e6eb; color: var(--text); }

      /* --- 主介面佈局 --- */
      #chat-ui { display: flex; width: 100%; max-width: 1200px; height: 90vh; background: var(--white); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }

      /* 側邊欄與分頁 */
      .sidebar { width: 300px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
      .sidebar-tabs { display: flex; border-bottom: 1px solid #eee; }
      .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; color: var(--light); font-weight: bold; }
      .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #fff; }
      
      .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
      .room-list { flex: 1; overflow-y: auto; }
      .room-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
      .room-item:hover { background: #edf2f7; }
      .room-item.active { background: #e7f3ff; color: var(--primary); border-left: 5px solid var(--primary); }

      /* 右側主區域 */
      .main-chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .chat-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
      .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }

      /* 訊息樣式 */
      .msg-row { display: flex; flex-direction: column; max-width: 75%; }
      .msg-row.mine { align-self: flex-end; align-items: flex-end; }
      .bubble { padding: 10px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
      .mine .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
      .others .bubble { background: #fff; border: 1px solid #eee; color: var(--text); border-bottom-left-radius: 4px; }
      .sender { font-size: 0.7rem; color: var(--light); margin-bottom: 3px; }
      .msg-img { max-width: 100%; border-radius: 10px; margin-top: 5px; }

      .input-area { padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 12px; align-items: center; background: #fff; }
      #msg-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #ddd; outline: none; background: #f0f2f5; }

      .icon-btn { border: none; background: none; cursor: pointer; font-size: 20px; color: var(--primary); padding: 5px; border-radius: 50%; transition: 0.2s; }
      .icon-btn:hover { background: #eee; }
  </style>
</head>
<body>

<div id="app">
    <!-- 登入與註冊 -->
    <div id="auth-section" class="auth-container">
        <div class="auth-card" id="login-form">
            <h2>NTHU Chat</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <div id="auth-error" style="color:red; font-size:12px; margin-bottom:10px;"></div>
            <button id="login-btn" class="btn btn-p">登入</button>
            <button id="signup-btn" class="btn" style="background:#28a745; color:white; margin-top:10px;">註冊</button>
        </div>
        <div class="auth-card hidden" id="profile-form">
            <h2>個人資料設定</h2>
            <input type="text" id="display-name" placeholder="您的暱稱">
            <input type="text" id="custom-id" placeholder="唯一 ID (例如: kev123)">
            <button id="save-profile-btn" class="btn btn-p">完成</button>
        </div>
    </div>

    <!-- 聊天介面 -->
    <div id="chat-ui" class="hidden">
        <aside class="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchTab('private')">好友/私聊</button>
                <button class="tab-btn" onclick="switchTab('group')">群組聊天</button>
            </div>
            <div class="sidebar-header">
                <strong id="list-title">好友</strong>
                <div>
                    <button class="icon-btn" id="add-friend-trigger">👤+</button>
                    <button class="icon-btn" id="add-group-trigger">💬+</button>
                </div>
            </div>
            <div id="room-list" class="room-list"></div>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <div>
                   <strong id="room-title">請選擇聊天室</strong>
                   <button id="invite-more-btn" class="hidden icon-btn" style="font-size:14px; margin-left:10px;">邀請成員 +</button>
                </div>
                <div>
                    <span id="my-info" style="font-size:12px; color:var(--light);"></span>
                    <a id="logout-btn" style="color:var(--danger); cursor:pointer; font-size:13px; margin-left:10px;">登出</a>
                </div>
            </header>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="input-area">
                <label style="font-size:24px; cursor:pointer;">📷<input type="file" id="img-input" accept="image/*" style="display:none;"></label>
                <input type="text" id="msg-input" placeholder="說點什麼吧..." autocomplete="off">
                <button id="send-btn" class="icon-btn">🚀</button>
            </div>
        </main>
    </div>
</div>

<!-- --- 彈窗模組 --- -->
<div id="modal-friend" class="modal-overlay hidden">
    <div class="modal-card">
        <h3>添加好友</h3>
        <input type="text" id="target-friend-id" placeholder="請輸入對方的 ID">
        <div class="modal-btns">
            <button class="btn btn-sec" onclick="closeModals()">取消</button>
            <button class="btn btn-p" id="confirm-add-friend">加入</button>
        </div>
    </div>
</div>

<div id="modal-group" class="modal-overlay hidden">
    <div class="modal-card">
        <h3>建立新群組</h3>
        <input type="text" id="target-group-name" placeholder="群組名稱">
        <input type="text" id="target-group-members" placeholder="成員 ID (用逗號隔開)">
        <div class="modal-btns">
            <button class="btn btn-sec" onclick="closeModals()">取消</button>
            <button class="btn btn-p" id="confirm-add-group">建立</button>
        </div>
    </div>
</div>

<div id="modal-invite" class="modal-overlay hidden">
    <div class="modal-card">
        <h3>邀請成員進入群組</h3>
        <input type="text" id="target-invite-id" placeholder="請輸入對方的 ID">
        <div class="modal-btns">
            <button class="btn btn-sec" onclick="closeModals()">取消</button>
            <button class="btn btn-p" id="confirm-invite">邀請</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, setDoc, getDoc, doc, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPtBwhqkLZAX3qWkGWKvOcBL5vmSxar-0",
      authDomain: "midterm-chatroom-ebe86.firebaseapp.com",
      projectId: "midterm-chatroom-ebe86",
      storageBucket: "midterm-chatroom-ebe86.firebasestorage.app",
      messagingSenderId: "870088985549",
      appId: "1:870088985549:web:409ee2cfceb1d14d121284"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserData = null;
    let activeRoomId = null;
    let currentTab = 'private'; // 'private' or 'group'
    let unsubRooms = null, unsubMessages = null;

    // --- 彈窗控制 ---
    window.closeModals = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
    document.getElementById('add-friend-trigger').onclick = () => document.getElementById('modal-friend').classList.remove('hidden');
    document.getElementById('add-group-trigger').onclick = () => document.getElementById('modal-group').classList.remove('hidden');
    document.getElementById('invite-more-btn').onclick = () => document.getElementById('modal-invite').classList.remove('hidden');

    // --- 身份驗證 ---
    document.getElementById('login-btn').onclick = async () => {
        try { await signInWithEmailAndPassword(auth, email.value, password.value); } 
        catch (e) { document.getElementById('auth-error').innerText = "登入失敗: " + e.code; }
    };

    document.getElementById('signup-btn').onclick = async () => {
        try { await createUserWithEmailAndPassword(auth, email.value, password.value); } 
        catch (e) { document.getElementById('auth-error').innerText = "註冊失敗: " + e.code; }
    };

    document.getElementById('logout-btn').onclick = () => {
        if(unsubRooms) unsubRooms();
        if(unsubMessages) unsubMessages();
        signOut(auth);
    };

    document.getElementById('save-profile-btn').onclick = async () => {
        const name = document.getElementById('display-name').value.trim();
        const cid = document.getElementById('custom-id').value.trim().toLowerCase();
        if(!name || !cid) return alert("請填寫資料");
        const idCheck = await getDocs(query(collection(db, "users"), where("customId", "==", cid)));
        if(!idCheck.empty) return alert("ID 已存在");
        await setDoc(doc(db, "users", auth.currentUser.uid), { displayName: name, customId: cid, email: auth.currentUser.email });
        checkUserProfile(auth.currentUser);
    };

    async function checkUserProfile(user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
            currentUserData = userDoc.data();
            document.getElementById('my-info').innerText = `${currentUserData.displayName} (@${currentUserData.customId})`;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            loadRooms();
        } else {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('profile-form').classList.remove('hidden');
        }
    }

    onAuthStateChanged(auth, (user) => {
        if (user) checkUserProfile(user);
        else {
            document.getElementById('chat-ui').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }
    });

    // --- 好友與群組邏輯 ---
    window.switchTab = (tab) => {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(tab === 'private' ? '好友' : '群組')));
        loadRooms();
    };

    async function loadRooms() {
        if (!currentUserData) return;
        if (unsubRooms) unsubRooms();
        
        // 抓取包含自己的所有房間
        const q = query(collection(db, "rooms"), where("members", "array-contains", currentUserData.customId));
        unsubRooms = onSnapshot(q, (snap) => {
            const list = document.getElementById('room-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const room = doc.data();
                // 根據當前分頁過濾
                if (room.type === currentTab) {
                    const div = document.createElement('div');
                    div.className = `room-item ${doc.id === activeRoomId ? 'active' : ''}`;
                    div.innerText = room.type === 'private' ? room.name.replace(currentUserData.displayName, "").replace("&", "").trim() : room.name;
                    div.onclick = () => {
                        activeRoomId = doc.id;
                        document.getElementById('room-title').innerText = div.innerText;
                        document.getElementById('invite-more-btn').classList.toggle('hidden', room.type !== 'group');
                        loadMessages(doc.id);
                        loadRooms();
                    };
                    list.appendChild(div);
                }
            });
        });
    }

    // 添加好友 (建立私聊)
    document.getElementById('confirm-add-friend').onclick = async () => {
        const targetId = document.getElementById('target-friend-id').value.trim().toLowerCase();
        if(!targetId || targetId === currentUserData.customId) return;
        
        const q = await getDocs(query(collection(db, "users"), where("customId", "==", targetId)));
        if(q.empty) return alert("找不到此用戶");
        
        const targetUser = q.docs[0].data();
        // 建立私聊房間
        await addDoc(collection(db, "rooms"), {
            name: `${currentUserData.displayName} & ${targetUser.displayName}`,
            type: 'private',
            members: [currentUserData.customId, targetId],
            ts: serverTimestamp()
        });
        closeModals();
        switchTab('private');
    };

    // 建立群組
    document.getElementById('confirm-add-group').onclick = async () => {
        const name = document.getElementById('target-group-name').value.trim();
        const ids = document.getElementById('target-group-members').value.split(',').map(i => i.trim().toLowerCase());
        if(!name) return;
        
        await addDoc(collection(db, "rooms"), {
            name: name,
            type: 'group',
            members: [currentUserData.customId, ...ids],
            ts: serverTimestamp()
        });
        closeModals();
        switchTab('group');
    };

    // 邀請更多人
    document.getElementById('confirm-invite').onclick = async () => {
        const newId = document.getElementById('target-invite-id').value.trim().toLowerCase();
        if(!newId || !activeRoomId) return;
        
        const q = await getDocs(query(collection(db, "users"), where("customId", "==", newId)));
        if(q.empty) return alert("找不到此用戶");

        await updateDoc(doc(db, "rooms", activeRoomId), {
            members: arrayUnion(newId)
        });
        alert("邀請成功！");
        closeModals();
    };

    // --- 訊息發送 ---
    function loadMessages(roomId) {
        if(unsubMessages) unsubMessages();
        const q = query(collection(db, "messages"), where("roomId", "==", roomId), orderBy("ts", "asc"));
        unsubMessages = onSnapshot(q, (snap) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = "";
            snap.forEach(doc => {
                const m = doc.data();
                const isMine = m.uid === auth.currentUser.uid;
                const row = document.createElement('div');
                row.className = `msg-row ${isMine ? 'mine' : 'others'}`;
                let content = m.type === 'image' ? `<img src="${m.content}" class="msg-img">` : `<div class="bubble">${m.content}</div>`;
                row.innerHTML = `<span class="sender">${m.senderName}</span>${content}`;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    async function sendMsg(content, type = 'text') {
        if(!activeRoomId || !content) return;
        await addDoc(collection(db, "messages"), {
            roomId: activeRoomId, uid: auth.currentUser.uid, senderName: currentUserData.displayName,
            senderId: currentUserData.customId, content: content, type: type, ts: serverTimestamp()
        });
        document.getElementById('msg-input').value = "";
    }

    document.getElementById('send-btn').onclick = () => sendMsg(document.getElementById('msg-input').value);
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key==='Enter') sendMsg(e.target.value); };

    // 圖片壓縮發送 (同前版)
    document.getElementById('img-input').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height, max = 600;
                if(w > h) { if(w > max) { h *= max/w; w = max; } }
                else { if(h > max) { w *= max/h; h = max; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                sendMsg(canvas.toDataURL('image/jpeg', 0.7), 'image');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
